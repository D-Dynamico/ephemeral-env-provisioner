services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: provisioner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ── Application ──────────────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # The app no longer creates its own tables, so migrations must run first.
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
      - //var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A worker.tasks worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      # Read by prometheus_client itself. The pool is prefork, so each child
      # counts in its own memory; without a shared directory to mmap into,
      # every increment dies with the child that made it. Kept off the bind
      # mount at /app deliberately — these files are process state, not source.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
    # Not published to the host. This endpoint has no authentication available
    # to it, unlike the API's /metrics, so it stays inside the compose network.
    expose:
      - "9100"
    volumes:
      - .:/app
      - //var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A worker.tasks beat --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: